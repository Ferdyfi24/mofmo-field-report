<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Full board · WMS Mofmofriends</title>
<link rel="preconnect" href="https://oloxoxmfbfxxibksxeug.supabase.co" crossorigin>
<link rel="icon" href="../ikon.svg" type="image/svg+xml">
<style>
html,body{margin:0;background:#FFFFFF;color:#121212;font:16px/1.5 'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){html,body{background:#121212;color:#F2F2F2}}
.tunggu{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.tunggu b{font:900 26px/1 Arial Black,Arial,sans-serif;text-transform:uppercase}
.bar{width:min(320px,80vw);height:14px;border:2px solid currentColor;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:repeating-linear-gradient(-45deg,#121212 0 8px,#F26419 8px 16px);animation:geser 1.1s linear infinite}
@keyframes geser{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
a{color:inherit;text-decoration-color:#F26419;text-decoration-thickness:2px}
.tombol{display:inline-block;padding:12px 18px;background:#F26419;color:#121212;font-weight:700;text-decoration:none}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
</style>
</head>
<body>
<div class="tunggu" id="tunggu" role="status"><b id="judul">Loading the full board</b><div class="bar"><i></i></div><div id="ket">Every write goes straight to the sheet.</div></div>
<script>
/* Papan lengkap di dalam WMS baru (10 Okt 2026).
 *
 * HTML papan lama (halamanPapan_) dicerminkan Apps Script ke Supabase dengan
 * kunci 'klien|papan'. Halaman ini mengambilnya, lalu menulisnya ulang ke
 * dokumen ini dengan pengganti google.script.run di depannya:
 *  - baca: fungsi papan yang potretnya ada di Supabase dibaca dari sana
 *    (0,2 detik), kecuali 15 menit sesudah ada tulisan dari perangkat ini;
 *  - selain itu (termasuk semua tulisan) langsung ke Apps Script lewat
 *    doPost {aksi:'wms', fn:'panggil'}; Apps Script memeriksa tiket,
 *    daftar fungsi yang boleh, dan mengganti 'WMS-TIKET' dengan kode asli.
 * Kode akses tidak pernah ada di perangkat: papan lama masuk dengan kata
 * pengganti 'WMS-TIKET'. */
(function () {
  'use strict';
  var SUPA = 'https://oloxoxmfbfxxibksxeug.supabase.co/functions/v1/wms';
  var API = 'https://script.google.com/macros/s/AKfycbzslW9akcAS2EINjrdcllgpGpuQzz_I2jHtNyEWixS-yl2HSsqE5kfTDjDGR8H_Zcq9xA/exec';
  var PAPAN_LAMA = API + '?lihat=1';
  function ambil(k) { var v = null; try { v = localStorage.getItem(k); if (v === null) v = sessionStorage.getItem(k); } catch (e) { v = null; } return v; }
  var id = ambil('wms_bhs') === 'id';
  var tiket = ambil('wms_tiket') || '';
  function teks(j, k) { document.getElementById('judul').textContent = j; document.getElementById('ket').innerHTML = k; }
  if (id) teks('Memuat papan lengkap', 'Setiap tulisan langsung masuk ke sheet.');
  if (!tiket) { location.replace('../'); return; }

  function gagal(pesan) {
    var b = document.querySelector('.bar'); if (b) b.remove();
    teks(id ? 'Papan lengkap belum siap' : 'Full board is not ready yet', pesan + '<br><br><a class="tombol" href="' + PAPAN_LAMA + '" rel="noopener">' + (id ? 'Buka papan lama' : 'Open the old board') + '</a> &nbsp; <a href="../">' + (id ? 'Kembali ke WMS' : 'Back to the WMS') + '</a>');
  }
  var KUNCI = 'klien|papan';
  fetch(SUPA, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'ambil', tiket: tiket, kunci: [KUNCI] }), credentials: 'omit', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (h) {
      if (h && h.perluMasuk) { gagal(id ? 'Tiket tidak dikenal server cermin. Masuk ulang di WMS, atau pakai papan lama dulu.' : 'The mirror server does not know this ticket. Sign in again in the WMS, or use the old board for now.'); return; }
      var x = h && h.ok && h.isi ? h.isi[KUNCI] : null;
      if (!x || !x.data || !x.data.html) { gagal(id ? 'Salinan papan belum dikirim Apps Script ke Supabase.' : 'Apps Script has not sent the board copy to Supabase yet.'); return; }
      tulis(String(x.data.html));
    }, function () { gagal(id ? 'Server cermin tidak terjangkau.' : 'The mirror server could not be reached.'); });

  function tulis(html) {
    var pengganti = '<script>(' + String(PENGGANTI) + ')(' + JSON.stringify({ supa: SUPA, api: API, tiket: tiket, id: id }) + ');<\/script>';
    var i = html.search(/<head[^>]*>/i);
    if (i > -1) { var j = html.indexOf('>', i) + 1; html = html.slice(0, j) + pengganti + html.slice(j); }
    else html = pengganti + html;
    document.open(); document.write(html); document.close();
  }

  /* Dijalankan DI DALAM dokumen papan, sebelum skrip papan mana pun. */
  function PENGGANTI(C) {
    var BACA = { dataPapan: 1, papanSummary: 1, papanInventory: 1, papanPenjualan: 1, papanKiriman: 1, papanKirimanUtama: 1, papanGerakStok: 1,
      obdDaftar: 1, obdSpData: 1, obdIuData: 1, papanGudang: 1, kesehatanPersediaan: 1, papanPerformaSku: 1, dataAlokasi: 1, fapLaporanAtasan: 1 };
    var LAMA_KOTOR = 15 * 60 * 1000;
    function kotor() { var t = 0; try { t = Number(sessionStorage.getItem('wms_kotor')) || 0; } catch (e) { t = 0; } return Date.now() - t < LAMA_KOTOR; }
    function tandaiKotor() { try { sessionStorage.setItem('wms_kotor', String(Date.now())); } catch (e) {} }
    function post(url, badan) {
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(badan), credentials: 'omit', redirect: 'follow', cache: 'no-store' })
        .then(function (r) { return r.text(); }).then(function (s) { try { return JSON.parse(s); } catch (e) { throw new Error(C.id ? 'Server papan tidak menjawab dengan benar.' : 'The board server did not answer properly.'); } });
    }
    function lewatApps(nama, args) {
      return post(C.api, { aksi: 'wms', fn: 'panggil', tiket: C.tiket, nama: nama, args: args }).then(function (h) {
        if (!h || !h.pintu) throw new Error(C.id ? 'Server papan belum di-deploy untuk papan lengkap.' : 'The board server is not deployed for the full board yet.');
        if (h.pintu === 'galat') throw new Error(h.pesan || 'Server error.');
        var x = h.hasil;
        if (x && x.perluMasuk) { location.replace('../'); throw new Error(x.pesan || 'Please sign in again.'); }
        return x;
      });
    }
    function jalan(nama, args) {
      var bisaPotret = BACA[nama] && args.length && args[0] === 'WMS-TIKET' && !kotor();
      var kunci = nama + '|' + JSON.stringify(['K'].concat(args.slice(1)));
      var potret = bisaPotret ? post(C.supa, { fn: 'ambil', tiket: C.tiket, kunci: [kunci] }).then(function (h) {
        var x = h && h.ok && h.isi ? h.isi[kunci] : null; return x ? x.data : undefined;
      }, function () { return undefined; }) : Promise.resolve(undefined);
      return potret.then(function (d) {
        if (d !== undefined) return d;
        if (!BACA[nama]) tandaiKotor();
        return lewatApps(nama, args);
      });
    }
    function pelari(sukses, gagal, obj) {
      var dasar = {
        withSuccessHandler: function (f) { return pelari(f, gagal, obj); },
        withFailureHandler: function (f) { return pelari(sukses, f, obj); },
        withUserObject: function (o) { return pelari(sukses, gagal, o); }
      };
      return new Proxy(dasar, { get: function (t, nama) {
        if (nama in t) return t[nama];
        if (typeof nama !== 'string' || nama === 'then') return undefined;
        return function () {
          var args = Array.prototype.slice.call(arguments);
          jalan(nama, args).then(function (r) { if (sukses) sukses(r, obj); }, function (e) {
            var er = e instanceof Error ? e : new Error(String(e)); if (gagal) gagal(er, obj); else console.error(er);
          });
        };
      } });
    }
    window.google = window.google || {};
    window.google.script = {
      run: pelari(null, null, undefined),
      url: { getLocation: function (cb) { cb({ hash: location.hash.slice(1), parameter: {}, parameters: {} }); } },
      host: { origin: location.origin, close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: { focus: function () {} } },
      history: { push: function () {}, replace: function () {}, setChangeHandler: function () {} }
    };
    /* Masuk otomatis: papan lama membaca kotak #kode lalu buka(). */
    var coba = 0;
    (function masukOtomatis() {
      var k = document.getElementById('kode');
      if (k && typeof window.buka === 'function') { k.value = 'WMS-TIKET'; try { window.buka(); } catch (e) { console.error(e); } return; }
      if (++coba < 200) setTimeout(masukOtomatis, 50);
    })();
    document.addEventListener('DOMContentLoaded', function () {
      var a = document.createElement('a');
      a.href = '../'; a.textContent = C.id ? '← WMS' : '← WMS';
      a.setAttribute('style', 'position:fixed;left:12px;bottom:12px;z-index:2147483000;background:#F26419;color:#121212;font:700 13px/1 ui-monospace,monospace;padding:10px 12px;text-decoration:none;border:2px solid #121212');
      document.body.appendChild(a);
    });
  }
})();
</script>
</body>
</html>
