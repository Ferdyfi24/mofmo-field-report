<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Mofmofriends Field Report</title>
<style>
:root{--latar:#F7F6F3;--kartu:#fff;--garis:#E3E0DB;--ink:#1F2328;--mut:#68707A;--aksen:#A0562C;--aksenTua:#8C4A24;--merah:#B42318;--kuning:#FFF7E8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--latar);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.atas{background:#fff;border-bottom:1px solid var(--garis);padding:14px 16px calc(12px);padding-top:calc(14px + env(safe-area-inset-top,0px))}
.atas small{display:block;color:var(--mut);font-size:12px}
.atas h1{margin:2px 0 0;font-size:20px}
.atas .baris{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;max-width:1180px;margin:0 auto}
.isi{max-width:440px;margin:0 auto;padding:16px}
.isi.lebar{max-width:1180px}
.kartu{background:var(--kartu);border:1px solid var(--garis);border-radius:14px;padding:16px}
label{display:block;font-size:12.5px;font-weight:700;color:#3D434A;margin:0 0 6px}
input,select{width:100%;font:inherit;font-size:16px;border:1.5px solid #D5D0C8;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid #E7C3A9;outline-offset:1px}
button{font:inherit;cursor:pointer}
.tombol{width:100%;margin-top:12px;min-height:48px;border:0;border-radius:10px;background:var(--aksen);color:#fff;font-weight:700;font-size:16px}
.tombol:hover{background:var(--aksenTua)}
.tombol[disabled]{opacity:.6;cursor:wait}
.tautan{border:0;background:none;color:var(--aksen);font-weight:700;padding:6px 0;min-height:36px}
.kecil{font-size:12.5px;color:var(--mut)}
.salah{color:var(--merah);min-height:18px;margin-top:8px;font-size:13px}
.pita{background:var(--kuning);border:1px solid #F0D49A;color:#7A5310;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:13.5px}
#lapMuat{min-height:20px;margin:8px 0}
#lapHost{display:block}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="atas"><div class="baris"><div><small id="atasKecil">Mofmofriends</small><h1 id="judul">Field report</h1></div><div id="kanan"></div></div></div>
<main class="isi" id="isi"></main>
<noscript><p style="padding:16px">This page needs JavaScript.</p></noscript>
<script>
/* Laporan lapangan untuk atasan, di luar script.google.com.
   Kenapa ada: web app Apps Script gagal dibuka ("Sorry, unable to open the
   file") di peramban yang login lebih dari satu akun Google. Halaman ini
   memanggil web app yang sama lewat fetch tanpa cookie, jadi akun Google
   mana pun yang login di HP tidak ikut campur.
   Kode akses cuma dipegang di memori selama halaman terbuka: tidak disimpan
   di perangkat, tidak ditaruh di alamat, dikirim di badan POST. */
var API = "https://script.google.com/macros/s/AKfycbzslW9akcAS2EINjrdcllgpGpuQzz_I2jHtNyEWixS-yl2HSsqE5kfTDjDGR8H_Zcq9xA/exec";
var KUNCI = "";
var PILIH = null;

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function panggil(periode) {
  var badan = JSON.stringify({ aksi: "atasan", kunci: KUNCI, periode: periode || "" });
  var ctl = typeof AbortController === "function" ? new AbortController() : null;
  var batas = ctl ? setTimeout(function () { ctl.abort(); }, 90000) : null;
  return fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: badan,
    credentials: "omit",
    redirect: "follow",
    cache: "no-store",
    signal: ctl ? ctl.signal : undefined
  }).then(function (r) {
    if (batas) clearTimeout(batas);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

function layarKode(pesan) {
  KUNCI = "";
  PILIH = null;
  $("isi").className = "isi";
  $("atasKecil").textContent = "Mofmofriends";
  $("judul").textContent = "Field report";
  $("kanan").innerHTML = "";
  $("isi").innerHTML =
    (pesan ? '<div class="pita" role="alert">' + esc(pesan) + "</div>" : "") +
    '<form class="kartu" id="fKode" autocomplete="off">' +
    '<label for="kode">Access code</label>' +
    '<input id="kode" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">' +
    '<div class="salah" id="kodeSalah"></div>' +
    '<button class="tombol" id="bBuka" type="submit">Open report</button>' +
    '<p class="kecil">Read-only view for management. Use the same access code as the data board. It is kept only while this page is open and is never saved on this device.</p>' +
    "</form>";
  var inp = $("kode");
  setTimeout(function () { try { inp.focus(); } catch (e) {} }, 80);
  $("fKode").addEventListener("submit", function (e) {
    e.preventDefault();
    var k = String(inp.value || "").trim();
    if (!k) { $("kodeSalah").textContent = "Type the access code first."; return; }
    KUNCI = k;
    inp.value = "";
    var b = $("bBuka");
    b.disabled = true;
    b.textContent = "Checking…";
    muat("");
  });
}

function muat(periode) {
  var m = $("lapMuat");
  if (m) m.textContent = "Loading the report…";
  panggil(periode).then(function (h) {
    if (!h || !h.ok) {
      var tolak = h && (h.gagal !== undefined || /Kode akses|access code/i.test(String(h.pesan || "")));
      layarKode(tolak ? "The access code does not match. Ask the board owner for it and type it again."
        : ((h && h.pesan) || "The report could not be opened. Try again."));
      return;
    }
    gambar(h);
  }).catch(function (err) {
    var m2 = $("lapMuat");
    var teks = "The connection dropped" + (err && err.name === "AbortError" ? " (no answer after 90 seconds)" : "") +
      ". Nothing changed; try again.";
    if (m2) { m2.textContent = teks; return; }
    layarKode(teks);
  });
}

function gambar(h) {
  $("isi").className = "isi lebar";
  $("atasKecil").textContent = "Field report · read-only";
  $("judul").textContent = h.teks || "Field report";
  $("kanan").innerHTML = '<button class="tautan" id="bTutup" type="button">Close</button>';
  var opt = (h.pilihan || []).map(function (x) {
    return '<option value="' + esc(x.nilai) + '"' + (x.pilih ? " selected" : "") + ">" + esc(x.teks) + "</option>";
  }).join("");
  $("isi").innerHTML =
    '<label for="pilihLap">Period</label><select id="pilihLap">' + opt + "</select>" +
    '<div id="lapMuat" class="kecil" role="status"></div><div id="lapHost"></div>';
  var host = $("lapHost");
  if (host.attachShadow) host.attachShadow({ mode: "open" }).innerHTML = h.html || "";
  else host.innerHTML = h.html || "";
  $("pilihLap").addEventListener("change", function () { muat(this.value); });
  $("bTutup").addEventListener("click", function () { layarKode(""); });
}

layarKode("");
</script>
</body>
</html>
